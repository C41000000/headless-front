<ng-template #brand>
  @if (visualIdentityService.visualIdentity()?.logo_url; as logoUrl) {
    <img class="brand-logo" [src]="logoUrl" [alt]="'Logo de ' + tenantName()" />
  } @else {
    <span class="brand-initial" aria-hidden="true">{{ tenantInitial() }}</span>
    <span class="app-brand-name">{{ tenantName() }}</span>
  }
</ng-template>

<app-shell
  homeRoute="/painel"
  [subtitle]="tenantContext.tenantDomain() ?? ''"
  [navItems]="navItems"
  [roleLabel]="roleLabel()"
>
  <ng-container shellBrand>
    <ng-container [ngTemplateOutlet]="brand" />
  </ng-container>
  <ng-container shellBrandCompact>
    <ng-container [ngTemplateOutlet]="brand" />
  </ng-container>

  <router-outlet />
</app-shell>
